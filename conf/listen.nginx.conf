# Country code for the book-banner bookseller link (static/js/banner.js, /geo.json below).
geoip_country /usr/share/GeoIP/GeoIP.dat;

# HTTPS - serves static files, frontend uses wss:// to new backend
server {
	server_name  listen.hatnote.com l2w.hatnote.com;
	listen 443 ssl;

	ssl_certificate /etc/letsencrypt/live/hatnote.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/hatnote.com/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	root  /home/hatnote/listen/static/;
	access_log  /home/hatnote/listen/logs/access.log combined buffer=128k flush=10s;
	error_log  /home/hatnote/listen/logs/error.log;

	expires  1d;

	# Visitor country for the book banner. Empty string when unknown.
	location = /geo.json {
		default_type application/json;
		expires off;
		add_header Cache-Control "no-store";
		return 200 '{"country":"$geoip_country_code"}';
	}
}

# HTTP -> HTTPS redirect
server {
	server_name  listen.hatnote.com l2w.hatnote.com;
	listen 80;
	return 301 https://$host$request_uri;
}
